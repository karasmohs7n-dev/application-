<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صوتي لايف — نموذج تفاعلي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E0B12;--s1:#1A151F;--s2:#241D2B;--pri:#E8A33D;--prih:#F2B85C;--pria:#C4841F;--sec:#E85D5D;--tx:#F5F1EA;--tx2:#A99FAE;--ok:#3FBF7F;--err:#E14B4B;--bd:#332B3B;--outer:#07050A;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Tajawal','IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;background:var(--outer);color:var(--tx);font-size:15px;line-height:22px;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--prih);outline-offset:2px}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
.app{height:100%;display:grid;grid-template-columns:320px 1fr;min-height:0}
.idx{background:var(--bg);border-inline-end:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
.idx-h{padding:20px 16px 12px}
.idx-h h1{font-size:22px;line-height:28px}
.idx-h p{color:var(--tx2);font-size:12px;line-height:16px;margin-top:4px}
.prog{height:4px;background:var(--s2);border-radius:8px;margin:12px 0 0;overflow:hidden}
.prog i{display:block;height:100%;background:var(--pri)}
.idx-s{margin:0 16px 8px;background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;color:var(--tx);width:calc(100% - 32px);font:inherit}
.idx-l{overflow:auto;padding:0 8px 24px;flex:1}
.g-t{color:var(--tx2);font-size:12px;line-height:16px;padding:16px 8px 4px;font-weight:700}
.it{display:flex;gap:12px;align-items:center;width:100%;padding:8px;border-radius:8px;font-size:14px;line-height:20px}
.it:hover{background:var(--s1)}
.it.on{background:var(--s2);color:var(--prih)}
.it b{font-weight:500;color:var(--tx2);min-width:36px;font-size:12px;direction:ltr;text-align:start}
.it .d{width:8px;height:8px;border-radius:99px;border:1.5px solid var(--bd);margin-inline-start:auto;flex:none}
.it .d.f{background:var(--pri);border-color:var(--pri)}
.stage{display:flex;flex-direction:column;min-height:0;min-width:0}
.tb{display:flex;gap:8px;align-items:center;justify-content:center;padding:12px 16px;flex-wrap:wrap}
.tb .chip{padding:4px 12px}
.tb .mb{display:none}
.pw{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 16px 16px}
.phone{width:390px;height:min(844px,100%);background:var(--bg);border-radius:40px;border:1px solid var(--bd);box-shadow:0 0 0 8px #120e17,0 30px 80px #000a;position:relative;overflow:hidden;display:flex;flex-direction:column}
.sb{height:28px;flex:none;display:flex;justify-content:space-between;align-items:end;padding:0 28px;font-size:12px;color:var(--tx2);font-weight:700}
.scr{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.ct{flex:1;min-height:0;overflow:auto;scrollbar-width:none}
.ct::-webkit-scrollbar{display:none}
.pad{padding:16px}
.hd{display:flex;align-items:center;gap:8px;padding:8px 12px;flex:none;min-height:56px}
.hd h3{flex:1;font-size:18px;line-height:24px;font-weight:700}
.hr{display:flex;gap:4px}
.ib{width:40px;height:40px;border-radius:99px;display:grid;place-items:center;flex:none;position:relative}
.ib:hover{background:var(--s2)}
.ib .dot{position:absolute;top:8px;inset-inline-end:9px;width:8px;height:8px;border-radius:9px;background:var(--sec)}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.s{width:16px;height:16px}.ic.l{width:32px;height:32px}
.flip{transform:scaleX(-1)}
h2{font-size:22px;line-height:28px}
.disp{font-size:32px;line-height:40px;font-weight:800}
.mut{color:var(--tx2)}.cap{font-size:12px;line-height:16px;color:var(--tx2)}
.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}.g8{gap:8px}.col{display:flex;flex-direction:column}
.btn{height:48px;border-radius:12px;padding:0 20px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:background .2s ease-out,transform .2s ease-out}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--pri);color:#1a1206}.btn.pri:hover{background:var(--prih)}.btn.pri:active{background:var(--pria)}
.btn.sec{background:var(--s2);border:1px solid var(--bd)}
.btn.ghost{color:var(--pri)}
.btn.dst{background:var(--err);color:#fff}
.btn.sm{height:36px;width:auto;padding:0 16px;font-size:13px}
.btn[disabled]{opacity:.4;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:8px;background:var(--s2);border:1px solid var(--bd);font-size:13px;line-height:20px;white-space:nowrap}
.chip.on{background:var(--pri);color:#1a1206;border-color:var(--pri);font-weight:700}
.hs{display:flex;gap:8px;overflow:auto;padding:4px 16px;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:16px}
.av{width:var(--sz);height:var(--sz);border-radius:999px;display:inline-grid;place-items:center;font-size:calc(var(--sz)*.42);font-weight:800;color:#fff;flex:none;line-height:1}
.av.vip{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--pri)}
.badge{font-size:11px;line-height:16px;padding:0 8px;border-radius:8px;font-weight:700;background:var(--s2)}
.live{background:var(--sec);color:#fff;display:inline-flex;align-items:center;gap:4px}
.live::before{content:"";width:6px;height:6px;border-radius:9px;background:#fff;animation:bl 1.5s infinite}
@keyframes bl{50%{opacity:.25}}
.searchbar{display:flex;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;color:var(--tx2);width:100%}
.inp{width:100%;background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;color:var(--tx);font:inherit;height:48px}
.inp::placeholder{color:var(--tx2)}
.lbl{font-size:12px;color:var(--tx2);margin:16px 0 4px;display:block}
.sech{display:flex;justify-content:space-between;align-items:center;padding:24px 16px 8px}
.sech h3{font-size:18px;line-height:24px}.sech a,.lnk{color:var(--pri);font-size:13px;cursor:pointer;font-weight:700}
.rc{display:flex;gap:12px;padding:12px;margin:0 16px 12px;background:var(--s1);border:1px solid var(--bd);border-radius:16px;width:calc(100% - 32px);align-items:center}
.rc:hover{border-color:var(--pri)}
.cov{width:64px;height:64px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:26px;font-weight:800;color:#fff8}
.rc .t{font-weight:700;font-size:16px;line-height:22px}
.feat{margin:16px;border-radius:24px;padding:20px;min-height:200px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;position:relative;overflow:hidden;width:calc(100% - 32px)}
.feat::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#0E0B12ee,#0E0B1200 65%)}
.feat>*{position:relative;z-index:1}
.wave{position:absolute;inset-inline-start:-10px;top:16px;display:flex;gap:4px;align-items:center;height:60px;z-index:1;opacity:.5}
.wave i{width:4px;border-radius:4px;background:var(--pri);animation:wv 1.2s ease-in-out infinite}
@keyframes wv{50%{transform:scaleY(.3)}}
.tabs{display:flex;background:var(--bg);border-top:1px solid var(--bd);padding:8px 8px 12px;flex:none}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;line-height:16px;color:var(--tx2);padding:4px}
.tabs button.on{color:var(--pri)}
.tabs .mid span{width:48px;height:48px;border-radius:16px;background:var(--pri);color:#1a1206;display:grid;place-items:center;margin-top:-16px}
.utabs{display:flex;gap:4px;padding:0 16px;border-bottom:1px solid var(--bd)}
.utabs button{padding:12px;color:var(--tx2);font-weight:700;border-bottom:2px solid transparent}
.utabs button.on{color:var(--pri);border-color:var(--pri)}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;border-bottom:1px solid var(--bd)}
.li .g{flex:1;min-width:0}.li .n{font-weight:700}
.li .c{color:var(--tx2);font-size:13px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg{width:44px;height:26px;border-radius:99px;background:var(--bd);position:relative;flex:none;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:99px;background:#fff;transition:inset-inline-start .2s}
.tg.on{background:var(--pri)}.tg.on::after{inset-inline-start:21px}
.foot{padding:12px 16px;border-top:1px solid var(--bd);background:var(--bg);flex:none;display:flex;gap:8px}
.sheetL{position:absolute;inset:0;z-index:20;display:none}
.sheetL.on{display:block}
.sheetL .bk{position:absolute;inset:0;background:#000a}
.sheet{position:absolute;bottom:0;inset-inline:0;background:var(--s2);border-radius:24px 24px 0 0;padding:16px;max-height:80%;overflow:auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .gr{width:40px;height:4px;border-radius:4px;background:var(--bd);margin:0 auto 16px}
.toast{position:absolute;bottom:88px;inset-inline:16px;background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;z-index:40;font-size:14px;animation:up .25s ease-out;text-align:center}
.off{background:var(--err);color:#fff;text-align:center;font-size:12px;line-height:16px;padding:4px;flex:none;display:flex;gap:4px;justify-content:center;align-items:center}
.sk{background:linear-gradient(90deg,var(--s1) 25%,var(--s2) 50%,var(--s1) 75%);background-size:200% 100%;animation:sh 1.4s infinite;border-radius:12px}
@keyframes sh{to{background-position:-200% 0}}
.stt{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:48px 32px}
.stt .ico{width:72px;height:72px;border-radius:24px;background:var(--s2);display:grid;place-items:center;color:var(--pri)}
.stt.e .ico{color:var(--err)}
.seatg{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px;padding:8px 16px}
.seat{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;line-height:16px;color:var(--tx2);position:relative;width:100%}
.sr{width:64px;height:64px;border-radius:99px;display:grid;place-items:center;border:2px solid var(--bd);position:relative;background:var(--s1)}
.seat.active .sr{border-color:var(--pri);animation:pl 1.5s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 #E8A33D88}100%{box-shadow:0 0 0 12px #E8A33D00}}
.seat.empty .sr{border-style:dashed;color:var(--tx2)}
.seat.locked .sr{background:var(--s2);color:var(--tx2)}
.seat.banned .sr{border-color:var(--err);color:var(--err);background:#E14B4B18}
.mk{position:absolute;bottom:-2px;inset-inline-end:-2px;width:22px;height:22px;background:var(--s2);border:2px solid var(--bg);border-radius:99px;display:grid;place-items:center;color:var(--sec)}
.mk .ic{width:12px;height:12px}
.chat{padding:8px 16px;display:flex;flex-direction:column;gap:8px}
.msg{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:20px}
.msg .b{background:var(--s1);padding:8px 12px;border-radius:12px;max-width:80%}
.msg .b b{color:var(--pri);font-size:12px;display:block;line-height:16px}
.msg.sys{justify-content:center;color:var(--tx2);font-size:12px}
.msg.gf .b{background:#E8A33D22;border:1px solid #E8A33D55}
.msg.me{flex-direction:row-reverse}
.msg.me .b{background:var(--pri);color:#1a1206}
.bar{display:flex;gap:8px;align-items:center;padding:8px 12px 12px;flex:none;border-top:1px solid var(--bd)}
.bar .inp{height:44px;border-radius:99px;padding:0 16px}
.rb{width:44px;height:44px;border-radius:99px;background:var(--s2);display:grid;place-items:center;flex:none}
.rb.pri{background:var(--pri);color:#1a1206}.rb.mic-on{background:var(--ok);color:#06210f}
.gg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gc{background:var(--s1);border:1.5px solid transparent;border-radius:16px;padding:12px 4px;text-align:center;font-size:12px;line-height:16px;display:flex;flex-direction:column;align-items:center;gap:4px}
.gc .e{font-size:30px;line-height:36px}
.gc.on{border-color:var(--pri);background:#E8A33D18}
.gc .p{color:var(--pri);font-weight:700;display:flex;gap:4px;align-items:center}
.fx{position:absolute;inset:0;z-index:30;display:none;place-items:center;pointer-events:none;text-align:center}
.fx.on{display:grid}
.fx .big{font-size:96px;line-height:1;animation:pop 1.6s ease-out forwards}
.fx.prem{background:radial-gradient(circle,#E8A33Dcc,#0E0B12ee 70%);animation:fade 2.4s forwards}
.fx.prem .big{font-size:150px;animation:pop 2.4s ease-out forwards}
@keyframes pop{0%{transform:scale(.3);opacity:0}20%{transform:scale(1.15);opacity:1}80%{opacity:1}100%{transform:scale(1);opacity:0}}
@keyframes fade{80%{opacity:1}100%{opacity:0}}
.fx p{font-weight:800;font-size:18px;margin-top:8px;text-shadow:0 2px 8px #000}
.otp{display:flex;gap:8px;direction:ltr;justify-content:center}
.otp input{width:48px;height:56px;text-align:center;font-size:24px;font-weight:800;background:var(--s1);border:1.5px solid var(--bd);border-radius:12px;color:var(--tx);font-family:inherit}
.otp input:focus{border-color:var(--pri);outline:0}
.hero{width:96px;height:96px;border-radius:32px;display:grid;place-items:center;background:linear-gradient(135deg,#E8A33D33,#E85D5D22);color:var(--pri);margin:8px auto 16px}
.ring3{position:relative;width:240px;height:240px;margin:24px auto;display:grid;place-items:center}
.ring3 i{position:absolute;border-radius:99px;border:1.5px solid var(--bd);animation:pl2 3s infinite}
@keyframes pl2{50%{border-color:var(--pri)}}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:9px;background:var(--bd)}.dots i.on{width:24px;background:var(--pri)}
.sw{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sw div{border-radius:12px;padding:12px 8px;font-size:11px;line-height:16px;border:1px solid var(--bd);direction:ltr;text-align:center}
.lvl{height:8px;background:var(--bd);border-radius:8px;overflow:hidden}.lvl i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--sec))}
.bub{max-width:78%;padding:8px 12px;border-radius:16px;font-size:14px;line-height:20px}
.bub.in{background:var(--s2);align-self:flex-start;border-end-start-radius:4px}
.bub.out{background:var(--pri);color:#1a1206;align-self:flex-end;border-end-end-radius:4px}
.mtabs{display:none}
@media (max-width:900px){
 body{overflow:hidden}
 .app{grid-template-columns:1fr}
 .idx{position:fixed;inset:0;z-index:100;display:none}
 .idx.on{display:flex}
 .tb .mb{display:inline-flex}
 .tb{padding:8px}
 .pw{padding:0}
 .phone{width:100%;height:100%;border-radius:0;border:0;box-shadow:none}
 .sb{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
</head>
<body>
<div class="app">
 <aside class="idx" id="idx">
  <div class="idx-h"><div class="row sp"><h1>صوتي لايف</h1><button class="ib mb" onclick="closeIdx()" aria-label="إغلاق" style="display:none" id="xb">✕</button></div><p id="cnt"></p><div class="prog"><i id="pg"></i></div></div>
  <input class="idx-s" id="is" placeholder="ابحث في الشاشات: اسم أو رقم" oninput="renderIdx()">
  <div class="idx-l" id="il"></div>
 </aside>
 <main class="stage">
  <div class="tb">
   <button class="chip mb" onclick="$('#idx').classList.add('on');$('#xb').style.display='grid'">☰ الشاشات</button>
   <span class="cap">حالة الشاشة:</span>
   <button class="chip st on" data-s="default" onclick="setSt('default')">عادية</button>
   <button class="chip st" data-s="loading" onclick="setSt('loading')">تحميل</button>
   <button class="chip st" data-s="empty" onclick="setSt('empty')">فارغة</button>
   <button class="chip st" data-s="error" onclick="setSt('error')">خطأ</button>
   <button class="chip st" data-s="offline" onclick="setSt('offline')">بلا اتصال</button>
  </div>
  <div class="pw">
   <div class="phone" id="phone">
    <div class="sb"><span>9:41</span><span>●●●</span></div>
    <div class="scr" id="scr"></div>
    <div class="sheetL" id="sheet"></div>
    <div class="fx" id="fx"></div>
   </div>
  </div>
 </main>
</div>
<script>
const GROUPS=[[0,5,'البداية والتسجيل','sparkle'],[6,10,'الرئيسية والاستكشاف','compass'],[11,16,'الغرف الصوتية','mic'],[17,22,'الهدايا والمحفظة','gift'],[23,28,'النشاط الاجتماعي والحالات العامة','chat'],[29,33,'الملف الشخصي','user'],[34,36,'الرسائل والإشعارات','chat'],[37,43,'الإعدادات','gear'],[44,45,'الإبلاغ والإشراف','alert'],[46,48,'الألعاب','star'],[49,51,'معارك PK','fire'],[52,54,'التصنيفات وVIP','crown'],[55,56,'الوكالة والعائلة','users'],[57,60,'المهام والدعوات','star'],[61,63,'السحب والتحقق','coin'],[64,66,'الشروط والقواعد','check'],[67,70,'الأذونات','lock'],[71,73,'العثور على أصدقاء','users'],[74,77,'أمان الحساب','lock'],[78,83,'حالات التطبيق','alert'],[84,90,'أدوات المضيف والغرفة','mic'],[91,95,'الاكتشاف والإشراف','compass'],[96,98,'الإنجازات والمشاركة','share'],[99,105,'استكمال التسجيل','user'],[106,110,'استكمال الرسائل','chat'],[111,117,'استكمال الغرف','mic'],[118,124,'استكمال الهدايا والمدفوعات','gift'],[125,131,'استكمال الوكالات والدعم','users'],[132,135,'حذف الحساب والخصوصية','lock'],[136,136,'البث المباشر بالفيديو','play']];
const RAW=`S00|شاشة البداية|شعار صوتي لايف، فحص الجلسة والإصدار
S01|التعريف 1|اكتشف غرفًا عربية تناسب اهتماماتك
S02|التعريف 2|تحدث واستمع وتعرّف على أشخاص جدد
S03|تسجيل الدخول أو إنشاء حساب|هاتف، بريد، Google، Apple
S04|التحقق برمز OTP|إدخال الرمز، إعادة الإرسال
S05|إعداد الحساب|الصورة، الاسم، اسم المستخدم، الدولة، الجنس والعمر
S06|الرئيسية|الغرف المقترحة، المتابعة، التصنيفات، المواضيع
S07|الاستكشاف|غرف رائجة، مضيفون، لغات وبلدان
S08|البحث الشامل|غرفة، مستخدم، موضوع، ID
S09|نتائج البحث|غرف، أشخاص، مواضيع، عائلات
S10|معاينة الغرفة|الغلاف، المضيف، المتحدثون، العدد، زر الانضمام
S11|الغرفة الصوتية|المقاعد، الدردشة، الهدايا، أدوات الغرفة
S12|أعضاء الغرفة|مضيفون، متحدثون، مستمعون، مشرفون
S13|طلب الصعود للمايك|إرسال الطلب، حالة الانتظار
S14|إدارة المايك والمقاعد|قبول، رفض، كتم، إنزال، قفل المقعد
S15|إنشاء غرفة|الاسم، الموضوع، الخصوصية، كلمة المرور، التصنيف

B.S11=()=>{const r=S.room,mic=S.me==='speaker';return{h:`<div class="hd"><button class="ib" onclick="sheet(leaveH())" aria-label="مغادرة">${ic('close')}</button><div style="flex:1;min-width:0"><div class="n" style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.n}</div><div class="cap">ID ${r.id} · ${r.l} مستمع</div></div><button class="ib" onclick="go('S12')" aria-label="الأعضاء">${ic('users')}</button><button class="ib" onclick="sheet(hostH())" aria-label="أدوات">${ic('more')}</button></div><button class="row g8" style="margin:0 12px 8px;background:linear-gradient(90deg,#241D2B,#332B3B);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;text-align:start" onclick="sheet(luckyH())"><span style="color:var(--pri)">${ic('star','s')}</span><span class="cap" style="color:var(--tx);flex:1">هدية الحظ نشطة الآن — أرسِل واربح حتى ×100 من قيمتها</span><span class="mut">${ic('chev','s')}</span></button>`,c:`<div class="col" style="align-items:center;padding:8px 0 16px"><div class="seat active" style="width:auto"><span class="sr" style="width:84px;height:84px">${av(r.host,76,'vip')}</span><span style="color:var(--tx);font-weight:700">${r.host} ${ic('crown','s')}</span></div></div><div class="seatg">${S.seats.map(seatH).join('')}</div><div class="chat">${S.chat.map(m=>m.sys?`<div class="msg sys">${m.t}</div>`:`<div class="msg ${m.gf?'gf':''} ${m.me?'me':''}">${av(m.u,32)}<div class="b">${m.gf?'':`<b>${m.u}</b>`}${m.t}</div></div>`).join('')}</div>`,f:`<div class="bar" style="width:100%;border:0;padding:0"><input id="ci" class="inp" placeholder="قل شيئًا…" onkeydown="if(event.key==='Enter')sendChat()"><button class="rb" onclick="sendChat()" aria-label="إرسال">${ic('send','flip')}</button><button class="rb ${mic?'mic-on':''}" onclick="micTap()" aria-label="المايك">${ic(mic?'mic':S.me==='waiting'?'more':'micoff')}</button><button class="rb pri" onclick="sheet(giftH())" aria-label="هدية">${ic('gift')}</button></div>`,noscroll:0}};

function seatTap(i){const x=S.seats[i];if(x.s==='empty')return sheet(micH());if(x.s==='locked')return toast('المقعد مقفول من المضيف');if(x.s==='banned')return toast('هذا المقعد محظور');sheet(`<div class="col" style="align-items:center;gap:8px">${av(x.u,72,'vip')}<h2>${x.u}</h2><p class="cap">مستوى 18 · متابع لك</p></div><div class="row g8" style="margin-top:16px"><button class="btn sec" onclick="closeSheet();sheet(giftH('${x.u}'))">${ic('gift','s')} هدية</button><button class="btn sec" onclick="closeSheet();go('S30')">الملف</button></div>`)}
function micTap(){if(S.me==='speaker'){S.me='listener';const k=S.seats.findIndex(x=>x.u==='أنت');S.seats[k]={s:'empty'};paint();return toast('نزلت من المايك')}sheet(micH())}
function micH(){if(S.me==='waiting')return `<div class="stt" style="padding:16px"><div class="ico">${ic('mic','l')}</div><h2>بانتظار موافقة المضيف</h2><p class="mut">أرسلنا طلبك. ستصعد تلقائيًا عند القبول.</p><button class="btn sec" onclick="S.me='listener';closeSheet();paint()">إلغاء الطلب</button></div>`;return `<div class="stt" style="padding:16px"><div class="ico">${ic('mic','l')}</div><h2>تريد الحديث؟</h2><p class="mut">سيصل طلبك للمضيف. عند القبول يفتح مايكروفونك.</p><button class="btn pri" onclick="reqMic()">اطلب المايك</button><button class="lnk" onclick="closeSheet()">ليس الآن</button></div>`}
function reqMic(){S.me='waiting';if(S.id==='S13')paint();else{sheet(micH());paint()}setTimeout(()=>{if(S.me!=='waiting')return;const k=S.seats.findIndex(x=>x.s==='empty');if(k<0)return;S.me='speaker';S.seats[k]={u:'أنت',s:'active'};S.chat.push({sys:1,t:'وافق المضيف على طلبك. أنت الآن على المايك.'});if(S.id==='S11'){closeSheet();paint();toast('صعدت إلى المايك')}else if(S.id==='S13'){toast('وافق المضيف على طلبك');go('S11')}},2200)}
function leaveH(){return `<h2>مغادرة الغرفة؟</h2><p class="mut" style="margin:8px 0 16px">يمكنك العودة في أي وقت طالما الغرفة مفتوحة.</p><div class="col" style="gap:8px"><button class="btn dst" onclick="S.me='listener';S.seats.forEach((x,i)=>{if(x.u==='أنت')S.seats[i]={s:'empty'}});back()">مغادرة</button><button class="btn sec" onclick="closeSheet()">البقاء</button></div>`}
function bagH(){return `<h2 style="margin-bottom:12px">الحقيبة</h2><div class="gg">${[['🖼️','إطار أفاتار ذهبي'],['💺','مقعد VIP مميز'],['🎫','بطاقة دخول VIP1'],['🚗','مركبة نادرة']].map(x=>`<div class="gc"><span class="e">${x[0]}</span><span>${x[1]}</span></div>`).join('')}</div><p class="cap" style="margin-top:12px;text-align:center">العناصر المكتسبة من الهدايا والمهام تظهر هنا ويمكن تفعيلها من ملفك الشخصي.</p>`}
function luckyH(){return `<div class="col" style="align-items:center;text-align:center;gap:8px"><div class="hero">${ic('star','l')}</div><h2>هدية الحظ</h2><p class="mut">أرسل أي هدية من قائمة الحظ، ولديك فرصة تلقائية للفوز بمضاعف من 2× إلى 100× من قيمتها كعملات ترد إلى محفظتك فورًا. كل من يرسل يدخل في نفس الجولة.</p><button class="btn pri sm" onclick="closeSheet();sheet(giftH())">أرسل هدية حظ</button></div>`}
function hostH(){return `<h2 style="margin-bottom:8px">أدوات الغرفة</h2>${[['music','مشغل الموسيقى','S84'],['star','المؤثرات الصوتية','S85'],['gear','إدارة المقاعد','S14'],['trophy','مكافأة صاحب الغرفة','',1],['flag','إبلاغ عن الغرفة','S44'],['users','عائلة الغرفة','S16']].map(([i,t,g,rw])=>lrow(i==='music'?'sparkle':i,t,'',rw?`closeSheet();sheet(hostRewardH())`:`go('${g}')`)).join('')}`}

const giftGrid=()=>`<div class="utabs" style="padding:0;margin-bottom:12px">${Object.keys(GIFTS).map(t=>`<button class="${S.gift.tab===t?'on':''}" onclick="S.gift.tab='${t}';S.gift.sel=null;refreshGift()">${t}</button>`).join('')}</div><div class="gg">${GIFTS[S.gift.tab].map((g,i)=>`<button class="gc ${S.gift.sel===i?'on':''}" onclick="S.gift.sel=${i};refreshGift()"><span class="e">${g[0]}</span><span>${g[1]}</span><span class="p">${ic('coin','s')}${g[2]}</span></button>`).join('')}</div>`;
function giftH(to){if(to)S.gift.to=to;return `<div class="row sp" style="margin-bottom:12px"><div class="row g8"><span class="cap">إلى</span>${['ليلى','أبو خالد','نور','هند'].map(n=>`<button class="chip ${S.gift.to===n?'on':''}" onclick="S.gift.to='${n}';refreshGift()">${n}</button>`).join('')}</div></div><div id="gg">${giftGrid()}</div><div class="row sp" style="margin-top:16px"><button class="chip" style="color:var(--pri);font-weight:700" onclick="closeSheet();go('S19')">${ic('coin','s')} <span id="gb">${S.coins.toLocaleString('en')}</span> · شحن</button><button class="btn pri sm" style="min-width:120px" onclick="sendGift()">إرسال</button></div>`}
function refreshGift(){if($('#sheet').classList.contains('on'))sheet(giftH());else paint()}
function sendGift(){const g=GIFTS[S.gift.tab][S.gift.sel];if(!g)return toast('اختر هدية أولًا');if(S.coins<g[2]){return sheet(`<div class="stt" style="padding:16px"><div class="ico">${ic('coin','l')}</div><h2>رصيدك غير كافٍ</h2><p class="mut">تحتاج ${g[2]} عملة وبرصيدك ${S.coins}. اشحن رصيدك لإرسال هذه الهدية.</p><button class="btn pri" onclick="go('S19')">اشحن العملات</button><button class="lnk" onclick="closeSheet()">إلغاء</button></div>`)}
 S.coins-=g[2];S.gift.sel=null;closeSheet();S.chat.push({gf:1,u:'أنت',t:`أرسلت ${g[1]} ${g[0]} إلى ${S.gift.to}`});const p=g[2]>=1000,f=$('#fx');f.className='fx on'+(p?' prem':'');f.innerHTML=`<div><div class="big">${g[0]}</div><p>${p?'هدية مميزة! ':''}${g[1]} إلى ${S.gift.to}</p></div>`;setTimeout(()=>f.className='fx',p?2400:1600);paint()}

function paint(){const m=META[S.id],b=B[S.id];let o;if(S.st==='loading'||S.st==='empty'||S.st==='error')o={h:hdr(m.t),c:stt(S.st,m)};else o=b?b():generic(m);
 const full=!o.h&&!o.tab&&S.id==='S10',tab=o.tab?tabBar(S.id):'';
 $('#scr').innerHTML=`${S.st==='offline'?`<div class="off">${ic('wifioff','s')} لا يوجد اتصال · عرض البيانات المحفوظة</div>`:''}${o.h||''}<div class="ct" id="ct">${o.c}</div>${o.fab||''}${o.f?`<div class="foot">${o.f}</div>`:''}${tab}`;
 document.querySelectorAll('.tb .st').forEach(e=>e.classList.toggle('on',e.dataset.s===S.st));
 renderIdx()}
const built=()=>ORDER.filter(i=>B[i]).length;
function renderIdx(){const f=($('#is').value||'').trim();let h='',last=-2;ORDER.forEach(id=>{const m=META[id];if(f&&!(m.t+m.id+m.d).includes(f))return;if(m.g!==last){last=m.g;h+=`<div class="g-t">${m.g<0?'صفحات نظام التصميم':GROUPS[m.g][2]}</div>`}h+=`<button class="it ${S.id===id?'on':''}" onclick="S.stack=[];go('${id}');closeIdx()"><b>${id}</b><span>${m.t}</span><i class="d ${B[id]?'f':''}"></i></button>`});$('#il').innerHTML=h;const n=built(),t=ORDER.length;$('#cnt').textContent=`${n} شاشة مصمَّمة بالكامل من ${t} · البقية إطارات سلكية قابلة للتصفح`;$('#pg').style.width=(n/t*100)+'%'}
function closeIdx(){$('#idx').classList.remove('on')}
paint();
